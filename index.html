<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="js/data.js"></script>
    <script type="module" src="js/script.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>

    <title>Library Management</title>
</head>

<body class="bg-[#FFEDD5] p-10 pt-0">
    <header class="w-full bg-[#FFEDD5] p-4 grid gap-4">
        <h1 class="title text-8xl font-bold text-[#EA580C]">Lmktaba</h1>
        <p class="font-bold text-2xl">let's read some books !!</p>
    </header>
    <main class="w-full p-4 grid gap-3">

        <section id="search" class="bg-white p-4 flex items-center justify-between gap-6  rounded-2xl">
            <div class="flex items-center size-1/3 gap-2">
                <label for="catrgory">Category</label>
                <select name="category" id="all-categories" class="border border-[#EA580C] p-3 w-[90%] rounded-2xl ">
                    <option value="0">Select a category</option>
                </select>
            </div>
            <div class="flex items-center size-1/3 gap-2">
                <label for="search by book name">Search</label>
                <input type="text" placeholder="Search for your favorit book"
                    class="border border-[#EA580C] p-3 w-[90%] rounded-2xl">
            </div>
            <div class="flex items-center size-1/3 gap-2">
                <label for="statu">Statu</label>
                <select name="category" id="all-categories" class="border border-[#EA580C] p-3 w-[90%]  rounded-2xl">
                    <option value="0">availabe</option>
                </select>
            </div>
        </section>
        <section class="bg-white p-4 flex items-center justify-between gap-6  rounded-2xl">
            <table id="data-table" class="w-full border border-[#EA580C] p-4 ">
                <thead class="culomns-names">
                    <tr>
                        <th>Id</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Statu</th>
                    </tr>
                </thead>
                <tbody id="main-data">
                    
                </tbody>

            </table>

        </section>

    </main>
</body>

</html>
